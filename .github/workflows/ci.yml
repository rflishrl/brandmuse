name: BrandMuse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint, Typecheck & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 & Astral uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check with Mypy
        run: uv run mypy app

      - name: Run unit & integration tests
        run: uv run pytest

      - name: Verify retrieval evaluation benchmark
        run: uv run python ../../eval/retrieval.py

  frontend:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Bun version
        id: bun-version
        run: echo "version=$(tr -d '[:space:]' < ../../.bun-version)" >> $GITHUB_OUTPUT

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint with Biome
        run: bun run lint

      - name: Type check with TypeScript
        run: bun run typecheck

      - name: Build static web assets
        run: bun run build
        env:
          VITE_API_URL: https://api.brandmuse.example.com

  contract-freshness:
    name: OpenAPI Client Freshness Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python & uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          python-version: "3.12"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install backend dependencies
        run: cd apps/api && uv sync --frozen

      - name: Install frontend dependencies
        run: cd apps/web && bun install --frozen-lockfile

      - name: Export OpenAPI schema
        run: cd apps/api && uv run python -m app.scripts.export_openapi

      - name: Generate TypeScript client with Orval
        run: cd apps/web && bun run api:generate

      - name: Verify working tree is clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || (echo "ERROR: Generated OpenAPI client is out of date. Run 'make api-generate' and commit changes." && exit 1)
