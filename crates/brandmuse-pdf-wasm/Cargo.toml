[package]
name = "brandmuse-pdf-wasm"
version = "0.1.0"
edition = "2021"
description = "Zero-copy PDF pre-flight inspector and tokenizer for BrandMuse in WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.100"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
